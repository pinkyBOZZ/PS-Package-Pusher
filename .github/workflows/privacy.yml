name: privacy

# Runs on every push (also docs-only ones that skip ci.yml): no real user profile paths in tracked files.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No real user profile paths
        run: |
          if git grep -n -I -E '[A-Za-z]:[\\/]+Users[\\/]+[A-Za-z0-9._~-]+' -- . | grep -v -F -e 'KORISN~1' -e 'Someone'; then
            echo "::error::a real user profile path is committed"; exit 1
          fi
