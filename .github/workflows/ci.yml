name: ci

# docs/images-only changes skip the build; privacy.yml still checks every push
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "assets/logo/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/logo/**", ".github/ISSUE_TEMPLATE/**"]

permissions:
  contents: read

# a newer push cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          # target/ is not cached: uploading it hung the post-cache step for 15+ min
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
