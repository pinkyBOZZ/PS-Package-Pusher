name: release

# Tag vX.Y.Z (e.g. v1.0.0) → build, zip, SHA256, GitHub release marked Latest, published automatically.
# Tag with a "-" (e.g. v1.0.1-rc.1) → draft pre-release instead, for the owner to review (PLAN 7.1, DESIGN 13.2).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match Cargo.toml version
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag cargo=$cargo_ver"
          [ "$tag" = "$cargo_ver" ] || { echo "::error::tag v$tag does not match Cargo.toml $cargo_ver"; exit 1; }
          echo "VERSION=$tag" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release --bin ps-package-pusher
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Third-party licenses
        shell: bash
        run: |
          cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
          for f in assets/fonts/Inter-OFL.txt assets/fonts/Audiowide-OFL.txt assets/fonts/Phosphor-LICENSE.txt; do
            printf '\n----------------------------------------------------------------------\n%s\n\n' "$(basename "$f")" >> THIRD-PARTY-LICENSES.txt
            cat "$f" >> THIRD-PARTY-LICENSES.txt
          done
      - name: Package
        shell: bash
        run: |
          name="PS-Package-Pusher-${VERSION}-win-x64"
          mkdir "$name"
          cp target/release/ps-package-pusher.exe LICENSE README.md THIRD-PARTY-LICENSES.txt "$name/"
          7z a -tzip "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "ZIP=$name.zip" >> "$GITHUB_ENV"
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in
            *-*) flags="--draft --prerelease" ;;
            *) flags="--latest" ;;
          esac
          notes=$(awk -v v="$VERSION" 'index($0, "## " v) == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "$ZIP" SHA256SUMS.txt $flags \
            --title "PS Package Pusher $VERSION" --notes "${notes:-See CHANGELOG.md}"
