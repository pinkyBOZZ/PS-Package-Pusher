[package]
name = "ps-package-pusher"
version = "0.0.1-rc.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Send PS4 PKG files to a jailbroken PS4 running Remote PKG Installer"
publish = false

[lib]
name = "pspp"
path = "src/lib.rs"

[[bin]]
name = "ps-package-pusher"
path = "src/main.rs"

[[bin]]
name = "mock-rpi"
path = "src/bin/mock_rpi.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "default_fonts", "clipboard"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
resvg = "0.50.0"

[build-dependencies]
winresource = "0.1"
