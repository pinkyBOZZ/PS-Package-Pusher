[package]
name = "ps-package-pusher"
version = "0.0.1-alpha.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Send PS4 PKG files to a jailbroken PS4 running Remote PKG Installer"
publish = false

[lib]
name = "pspp"
path = "src/lib.rs"

[[bin]]
name = "ps-package-pusher"
path = "src/main.rs"

[[bin]]
name = "mock-rpi"
path = "src/bin/mock_rpi.rs"

[dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
resvg = "0.50.0"
